---
name: Build RPM packages

on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  # Fast check for automated version-update PRs created by update_templating_versions.py:
  # builds only the exporter named in the PR title before the full build runs.
  build_changed:
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'prometheus-rpm-bot' &&
      startsWith(github.event.pull_request.title, 'Update ')
    strategy:
      fail-fast: false
      matrix:
        version:
          - 9
          - 8
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python environment
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Get exporter name from PR title
        id: exporter
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          name=$(echo "$PR_TITLE" | awk '{print $2}')
          if ! [[ "$name" =~ ^[a-z0-9_]+$ ]]; then
            echo "Unexpected exporter name: '$name'" >&2
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Build ${{ steps.exporter.outputs.name }}
        run: make build${{ matrix.version }}-${{ steps.exporter.outputs.name }}

  build_packages:
    needs: build_changed
    # Run when build_changed passed or was skipped (manual PRs, pushes to master, manual runs)
    if: ${{ !failure() && !cancelled() }}
    strategy:
      matrix:
        build_type:
          - auto
          - manual
        version:
          - 9
          - 8
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python environment
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Build packages
        run: make ${{ matrix.build_type }}${{ matrix.version }}

      - name: Cache built packages
        uses: actions/cache@v5
        id: restore-build
        with:
          path: _dist${{ matrix.version }}/*
          key: ${{ github.sha }}-${{ matrix.build_type }}${{ matrix.version }}

  publish_packages:
    needs: build_packages
    # The explicit result check is needed because build_changed is skipped on pushes
    # to master, and the default success() check would otherwise skip this job too.
    if: >
      !failure() && !cancelled() &&
      needs.build_packages.result == 'success' &&
      github.ref == 'refs/heads/master' &&
      github.repository == 'lest/prometheus-rpm'
    strategy:
      matrix:
        version:
          - 9
          - 8
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Ruby environment
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Install PackageCloud CLI
        run: gem install package_cloud

      - name: Create GPG key secret
        if: env.RPM_GPG_KEY_SECRET != null
        run: openssl aes-256-cbc -k "${RPM_GPG_KEY_SECRET}" -in secret.asc.enc -out secret.asc -d -md md5
        env:
          RPM_GPG_KEY_SECRET: ${{ secrets.RPM_GPG_KEY_SECRET }}

      - name: Save GPG key passphrase
        if: env.RPM_GPG_KEY_PASSPHRASE != null
        run: echo "${RPM_GPG_KEY_PASSPHRASE}" > .passphrase
        env:
          RPM_GPG_KEY_PASSPHRASE: ${{ secrets.RPM_GPG_KEY_PASSPHRASE }}

      - name: Restore auto RPM package cache
        uses: actions/cache@v5
        with:
          path: _dist${{ matrix.version }}/*
          key: ${{ github.sha }}-auto${{ matrix.version }}

      - name: Restore manual RPM package cache
        uses: actions/cache@v5
        with:
          path: _dist${{ matrix.version }}/*
          key: ${{ github.sha }}-manual${{ matrix.version }}

      - name: Publish
        run: make publish${{ matrix.version }}
        env:
          PACKAGECLOUD_TOKEN: ${{ secrets.PACKAGECLOUD_TOKEN }}
